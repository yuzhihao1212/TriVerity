<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Poppins, 'Open Sans', Helvetica, Arial, sans-serif">
  <title>TriVerity architecture: multi-agent dispute resolution for Ryde</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#31373E"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A939E"/>
    </marker>
    <style>
      .det { fill: #F3F5F7; stroke: #31373E; stroke-width: 1.5; }
      .llm { fill: #FDF0F4; stroke: #E93864; stroke-width: 1.8; }
      .frame { fill: #FFFFFF; stroke: #31373E; stroke-width: 1.5; }
      .h { font-size: 16px; font-weight: 700; fill: #31373E; }
      .t { font-size: 12.5px; fill: #334155; }
      .note { font-size: 12px; font-style: italic; fill: #69727D; }
      .mono { font-size: 11.5px; font-family: Menlo, Consolas, monospace; fill: #334155; }
      .lbl { font-size: 11px; fill: #69727D; }
      .flow { stroke: #31373E; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .rules { stroke: #8A939E; stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow-grey); }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#FFFFFF"/>

  <!-- Title and legend -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#E93864">TriVerity</text>
  <text x="152" y="44" font-size="22" font-weight="600" fill="#31373E">Multi-agent dispute resolution for Ryde</text>
  <text x="40" y="68" class="lbl" font-size="13">Digital Native Track (Ryde) · system architecture</text>

  <rect x="900" y="30" width="16" height="16" rx="3" class="llm"/>
  <text x="924" y="43" class="t">Uses Hy3 LLM</text>
  <rect x="1030" y="30" width="16" height="16" rx="3" class="det"/>
  <text x="1054" y="43" class="t">Deterministic code</text>
  <line x1="1190" y1="38" x2="1230" y2="38" class="rules" marker-end="none"/>
  <text x="1238" y="43" class="t">Policy rules</text>

  <!-- Row 1: input, evidence, policy -->
  <rect x="40" y="100" width="260" height="130" rx="14" class="det"/>
  <text x="60" y="128" class="h">Dispute filed</text>
  <text x="60" y="154" class="t">Rider claim · driver statement</text>
  <text x="60" y="174" class="t">Trip &amp; GPS · fare breakdown</text>
  <text x="60" y="194" class="t">Chat log · rider &amp; driver history</text>
  <text x="60" y="216" class="mono">DisputeCase</text>

  <rect x="360" y="100" width="440" height="130" rx="14" class="det"/>
  <text x="380" y="128" class="h">Evidence loader</text>
  <text x="380" y="151" class="t">Trip &amp; duration · pickup distance &amp; waiting</text>
  <text x="380" y="171" class="t">GPS telemetry: path · stops · data gaps</text>
  <text x="380" y="191" class="t">Fare: surge &amp; promo checks · chat · history</text>
  <text x="380" y="216" class="note">Computed facts by source and ID · no LLM</text>

  <rect x="1080" y="100" width="280" height="130" rx="14" class="det"/>
  <text x="1100" y="128" class="h">Company policy</text>
  <text x="1100" y="152" class="mono">ryde_mock_policy.json</text>
  <text x="1100" y="174" class="t">Route deviation: RD-1 … RD-4</text>
  <text x="1100" y="194" class="t">No-show charge: NS-1 … NS-4</text>
  <text x="1100" y="214" class="t">SAFE-1 · FRAUD-1 · ESC-1 · PREC-1</text>

  <path d="M300,165 H356" class="flow"/>

  <!-- Facts and policy into row 2 -->
  <path d="M400,230 V286" class="flow"/>
  <path d="M660,230 V286" class="flow"/>
  <path d="M800,200 H960 V286" class="flow"/>
  <text x="408" y="250" class="lbl">facts</text>
  <text x="668" y="250" class="lbl">facts</text>
  <text x="968" y="250" class="lbl">facts + history</text>
  <path d="M1220,230 V262 H300 V286" class="rules"/>
  <path d="M740,262 V286" class="rules"/>
  <text x="1228" y="256" class="lbl">rules to cite</text>

  <!-- Facts bus to the judge -->
  <path d="M375,230 V272 H110 V775 H176" class="flow"/>
  <text x="102" y="520" class="lbl" transform="rotate(-90 102 520)" text-anchor="middle">facts</text>
  <text x="160" y="286" class="lbl">run in parallel ↓</text>

  <!-- Row 2: advocates, fraud detector, gateway -->
  <rect x="160" y="290" width="300" height="130" rx="14" class="llm"/>
  <text x="180" y="318" class="h">Rider advocate</text>
  <text x="180" y="344" class="t">Argues only for the rider</text>
  <text x="180" y="364" class="t">Cites evidence IDs and supporting rules</text>
  <text x="180" y="384" class="t">Checked: real rule IDs, valid JSON</text>
  <text x="180" y="406" class="note">Any failure → deterministic fallback</text>

  <rect x="500" y="290" width="300" height="130" rx="14" class="llm"/>
  <text x="520" y="318" class="h">Driver advocate</text>
  <text x="520" y="344" class="t">Argues only for the driver</text>
  <text x="520" y="364" class="t">Cites evidence IDs and supporting rules</text>
  <text x="520" y="384" class="t">Checked: real rule IDs, valid JSON</text>
  <text x="520" y="406" class="note">Any failure → deterministic fallback</text>

  <rect x="840" y="290" width="260" height="130" rx="14" class="det"/>
  <text x="860" y="318" class="h">Fraud detector</text>
  <text x="860" y="344" class="t">Scores each party's bad-faith risk</text>
  <text x="860" y="364" class="t">from history and contradicted claims</text>
  <text x="860" y="384" class="t">Never changes an amount</text>
  <text x="860" y="406" class="note">High risk → escalate (FRAUD-1)</text>

  <rect x="1140" y="290" width="220" height="150" rx="14" class="llm"/>
  <text x="1160" y="318" class="h">LLM gateway</text>
  <text x="1160" y="342" class="t">Tencent Cloud TokenHub</text>
  <text x="1160" y="362" class="t">Model: Hy3</text>
  <text x="1160" y="382" class="mono">llm_client.py</text>
  <text x="1160" y="402" class="t">5 calls including both replies</text>
  <text x="1160" y="426" class="note">Used by every pink box</text>

  <!-- Each advocate receives the opposing case and replies once. -->
  <path d="M310,420 V446" class="flow"/>
  <path d="M650,420 V446" class="flow"/>
  <rect x="160" y="450" width="640" height="70" rx="14" class="llm"/>
  <text x="180" y="475" class="h">Rebuttal round: rider ↔ driver</text>
  <text x="180" y="495" class="t">Each advocate answers the other case once, citing computed evidence IDs</text>
  <text x="180" y="512" class="note">Checked replies · fallback on failure · skipped unless both initial cases use Hy3</text>
  <path d="M480,520 V676" class="flow"/>
  <text x="490" y="539" class="lbl">both cases + replies</text>
  <path d="M970,420 V676" class="flow"/>
  <text x="978" y="490" class="lbl">risk + signals</text>
  <path d="M1360,200 H1380 V700 H1104" class="rules"/>
  <text x="1372" y="720" class="lbl" text-anchor="end">rules applied</text>

  <!-- Policy & Precedent agent: retrieval over past rulings, consistency check. -->
  <path d="M820,200 V556" class="flow"/>
  <text x="826" y="545" class="lbl">facts</text>
  <rect x="520" y="560" width="400" height="96" rx="14" class="det"/>
  <text x="540" y="585" class="h">Policy &amp; Precedent agent</text>
  <text x="540" y="606" class="t">Retrieves the 3 closest past rulings (162 synthetic)</text>
  <text x="540" y="625" class="t">Checks the rules' decision against them</text>
  <text x="540" y="645" class="note">Reviewers overruled close cases → PREC-1 review</text>
  <path d="M720,656 V676" class="flow"/>

  <!-- Judge: deterministic ruling followed by checked narration. -->
  <rect x="160" y="680" width="940" height="190" rx="16" class="frame"/>
  <text x="180" y="707" class="h">Judge agent</text>
  <rect x="180" y="720" width="380" height="135" rx="12" class="det"/>
  <text x="198" y="743" class="h">① Policy rules decide</text>
  <text x="198" y="765" class="t">Decision · refund · confidence · rules cited</text>
  <text x="198" y="785" class="t">Decides from facts, not narratives</text>
  <text x="198" y="805" class="t">Threats or high fraud risk → human review</text>
  <text x="198" y="825" class="t">ESC-1: confidence &lt; 60% → human review</text>
  <text x="198" y="845" class="t">PREC-1: reviewers ruled otherwise → review</text>
  <path d="M560,787 H596" class="flow"/>
  <rect x="600" y="720" width="480" height="135" rx="12" class="llm"/>
  <text x="618" y="743" class="h">② Hy3 explains the ruling</text>
  <text x="618" y="765" class="t">Answers both arguments and replies for the case record</text>
  <text x="618" y="785" class="t">Cites the retrieved precedents in the record (RAG)</text>
  <text x="618" y="805" class="t">Party messages: no fraud risk, history or precedents</text>
  <text x="618" y="825" class="t">Checks: amounts · cited rules · no refund promise on review</text>
  <text x="618" y="845" class="note">Invalid output → deterministic explanation</text>

  <!-- Output and downstream views. -->
  <path d="M630,870 V896" class="flow"/>
  <rect x="160" y="900" width="940" height="80" rx="14" class="det"/>
  <text x="180" y="924" class="h">Resolution</text>
  <text x="180" y="945" class="t">Ruling · action · confidence · cited policy · internal: fraud risk, review triage, precedents</text>
  <text x="180" y="965" class="t">Neutral record + party messages · agent log · AI / Fallback source for each step</text>

  <rect x="1140" y="850" width="220" height="56" rx="12" class="det"/>
  <text x="1158" y="874" class="h" font-size="15">Human reviewer</text>
  <text x="1158" y="894" class="t">Escalated disputes, by triage</text>
  <rect x="1140" y="920" width="220" height="56" rx="12" class="det"/>
  <text x="1158" y="944" class="h" font-size="15">Demo UI</text>
  <text x="1158" y="964" class="t">Five-step case workflow</text>

  <path d="M1100,920 H1120 V878 H1136" class="flow"/>
  <path d="M1100,948 H1136" class="flow"/>

  <!-- Learning feedback loop: reviewer decisions become precedents. -->
  <path d="M1250,850 V610 H924" class="rules"/>
  <text x="1258" y="760" class="lbl">feedback: reviewer</text>
  <text x="1258" y="775" class="lbl">decisions → precedents</text>
</svg>
