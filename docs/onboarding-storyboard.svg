<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Planned TriVerity onboarding tour: six-frame storyboard</title>
  <desc id="desc">A proposed spotlight tour for non-technical reviewers. Six frames show the home entry, computed evidence, evidence collection, two advocates, policy ruling and human approval. Grey console wireframes are dimmed except for a pink-outlined spotlight, with a white explanation card and connecting arrow. The tour would use a recorded actual run of synthetic sample D001, with a $6.30 partial refund. These wireframes are a design proposal, not AI output or an implemented feature.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="Poppins, Arial, sans-serif" fill="#1f2937">
    <text x="32" y="40" font-size="28" font-weight="700">Planned onboarding tour</text>
    <text x="32" y="70" font-size="17">About 2 minutes · Learn what each agent contributes and where the reviewer stays in control</text>
    <text x="32" y="96" font-size="16">Tutorial · a recorded run of case D001 · nothing here runs the AI or changes real cases</text>
